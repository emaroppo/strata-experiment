[project]
name = "strata-experiment"
version = "0.1.0"
description = "An experiment written down once: stages from a config, a grid over them, and a ledger of what ran"
readme = "README.md"
requires-python = ">=3.13"
# Sequences the other packages' stages over a project; nothing depends
# on it. The labeller is a peer over the same project, not a dependency.
dependencies = [
    "pydantic>=2.0",
    "strata-labels>=0.1,<0.2",
    "strata-common>=0.1,<0.2",
    "strata-catalog>=0.1,<0.2",
    "strata-modelling>=0.1,<0.2",
    "strata-project>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
strata-experiment = "strata.experiment.cli:main"


# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
